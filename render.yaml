services:
  # Backend FastAPI Web Service
  - type: web
    name: student-query-backend
    env: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PROJECT_NAME
        value: "Multilingual Student Query Intent & Response Routing System"
      - key: DATABASE_URL
        value: "sqlite:///./student_query.db"
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: JWT_ALGORITHM
        value: "HS256"
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "1440"
      - key: CORS_ORIGIN_REGEX
        value: "https?://.*"
